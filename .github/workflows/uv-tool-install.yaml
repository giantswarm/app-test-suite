name: uv tool install

# Checks that `ats` installs with `uv tool install` and runs on every Python version
# pyproject.toml declares, outside the Docker image. The CircleCI tests only run inside
# the image, on its single Python version.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  uv-tool-install:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ats as a uv tool
        run: uv tool install --python "${{ matrix.python-version }}" .

      - name: Run ats
        run: |
          ats --version
          ats --help

      - name: Run unit tests
        run: uv run --locked --python "${{ matrix.python-version }}" pytest tests/
